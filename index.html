<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Solari Split-Flap Clock & Board</title>
  <style>
    :root {
      --bg: #0b0c10;
      --chassis-bg: #14161f;
      --chassis-border: #1e2230;
      --chassis-shadow: 0 35px 100px rgba(0, 0, 0, 0.9), inset 0 2px 4px rgba(255, 255, 255, 0.05);
      --flap-top-bg: linear-gradient(180deg, #222634 0%, #161822 100%);
      --flap-bot-bg: linear-gradient(180deg, #151722 0%, #0e1017 100%);
      --flap-text: #f8fafc;
      --flap-border: #090a0e;
      --hinge-notch: #2b3144;
      --accent: #f59e0b;
      --accent-glow: rgba(245, 158, 11, 0.35);
      --panel-bg: rgba(20, 22, 31, 0.92);
      --border-color: rgba(255, 255, 255, 0.08);
      --text-main: #f1f5f9;
      --text-muted: #64748b;
    }

    [data-theme="railway"] {
      --bg: #13120d;
      --chassis-bg: #1c1b14;
      --chassis-border: #2d2a1e;
      --flap-top-bg: linear-gradient(180deg, #2c291d 0%, #1d1b13 100%);
      --flap-bot-bg: linear-gradient(180deg, #1b1912 0%, #11100b 100%);
      --flap-text: #ffca28;
      --flap-border: #0a0906;
      --hinge-notch: #3e3927;
      --accent: #ffca28;
      --accent-glow: rgba(255, 202, 40, 0.35);
    }

    [data-theme="bronze"] {
      --bg: #0e1311;
      --chassis-bg: #151e1a;
      --chassis-border: #22302a;
      --flap-top-bg: linear-gradient(180deg, #1d2b25 0%, #141d19 100%);
      --flap-bot-bg: linear-gradient(180deg, #121915 0%, #0c110e 100%);
      --flap-text: #eae5d8;
      --flap-border: #080c0a;
      --hinge-notch: #2c3e37;
      --accent: #5eead4;
      --accent-glow: rgba(94, 234, 212, 0.35);
    }

    [data-theme="cyber"] {
      --bg: #03060f;
      --chassis-bg: #070e1f;
      --chassis-border: #0e1b3d;
      --flap-top-bg: linear-gradient(180deg, #0e1d42 0%, #070e22 100%);
      --flap-bot-bg: linear-gradient(180deg, #060c1d 0%, #030610 100%);
      --flap-text: #00f3ff;
      --flap-border: #020409;
      --hinge-notch: #15295c;
      --accent: #00f3ff;
      --accent-glow: rgba(0, 243, 255, 0.4);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', Roboto, sans-serif;
      background: var(--bg);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
      overflow-x: hidden;
      transition: background 0.4s ease;
    }

    /* Top Navigation / Brand */
    header {
      width: 100%;
      max-width: 1080px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 18px;
      padding: 0 4px;
    }

    .brand {
      display: flex;
      align-items: baseline;
      gap: 12px;
    }

    .brand h1 {
      font-size: 21px;
      font-weight: 800;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: var(--text-main);
    }

    .brand span {
      font-size: 11px;
      color: var(--text-muted);
      letter-spacing: 1.5px;
      text-transform: uppercase;
      font-weight: 600;
    }

    .header-indicators {
      display: flex;
      align-items: center;
      gap: 16px;
      font-size: 13px;
      color: var(--text-muted);
    }

    .mode-pill {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      padding: 5px 12px;
      border-radius: 20px;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--border-color);
      font-size: 11px;
      letter-spacing: 1px;
      text-transform: uppercase;
      font-weight: 600;
      color: var(--accent);
    }

    .live-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #10b981;
      box-shadow: 0 0 8px #10b981;
      animation: pulse 2s infinite ease-in-out;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.35; transform: scale(0.85); }
    }

    /* Primary Navigation Modes (Large, Clear, Beautiful) */
    .mode-switcher {
      display: flex;
      gap: 8px;
      margin-bottom: 22px;
      background: var(--panel-bg);
      padding: 6px;
      border-radius: 16px;
      border: 1px solid var(--border-color);
      box-shadow: 0 8px 25px rgba(0, 0, 0, 0.3);
      flex-wrap: wrap;
      justify-content: center;
    }

    .tab-btn {
      background: transparent;
      border: none;
      color: var(--text-muted);
      padding: 9px 18px;
      border-radius: 11px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      transition: all 0.2s ease;
    }

    .tab-btn:hover {
      color: var(--text-main);
      background: rgba(255, 255, 255, 0.04);
    }

    .tab-btn.active {
      background: var(--accent);
      color: #000;
      box-shadow: 0 4px 14px var(--accent-glow);
    }

    /* ==========================================================================
       VIEW 1: GIANT RETRO FLIP CLOCK
       ========================================================================== */
    .giant-clock-view {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 20px;
      padding: 36px 48px;
      background: var(--chassis-bg);
      border: 3px solid var(--chassis-border);
      border-radius: 28px;
      box-shadow: var(--chassis-shadow);
      position: relative;
    }

    .giant-date-bar {
      font-size: 14px;
      font-weight: 700;
      letter-spacing: 3px;
      text-transform: uppercase;
      color: var(--accent);
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .giant-digits-row {
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .giant-unit {
      position: relative;
      width: 110px;
      height: 156px;
      perspective: 500px;
      background: #090a0e;
      border-radius: 10px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.8), 0 0 0 1px rgba(255, 255, 255, 0.05);
    }

    .giant-unit .flap-half-inner {
      height: 156px;
      font-size: 116px;
      line-height: 156px;
      font-weight: 800;
      font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Helvetica Neue', Arial, sans-serif;
    }

    .giant-unit .flap-bot .flap-half-inner {
      top: -78px;
    }

    .giant-colon {
      display: flex;
      flex-direction: column;
      gap: 24px;
      padding: 0 4px;
    }

    .giant-colon-dot {
      width: 12px;
      height: 12px;
      border-radius: 50%;
      background: var(--accent);
      box-shadow: 0 0 12px var(--accent-glow);
    }

    .giant-ampm-tag {
      align-self: flex-end;
      margin-bottom: 12px;
      font-size: 18px;
      font-weight: 800;
      letter-spacing: 2px;
      color: var(--accent);
      padding: 6px 14px;
      border-radius: 8px;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--border-color);
    }

    .giant-caption {
      font-size: 12px;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: var(--text-muted);
      font-weight: 600;
    }

    /* ==========================================================================
       VIEW 2: MULTI-LINE SOLARI MATRIX BOARD
       ========================================================================== */
    .matrix-board-view {
      display: none;
      position: relative;
      max-width: 100%;
      flex-direction: column;
      align-items: center;
    }

    .matrix-board-view.active {
      display: flex;
    }

    .giant-clock-view.hidden {
      display: none;
    }

    .chassis {
      background: var(--chassis-bg);
      border: 3px solid var(--chassis-border);
      border-radius: 20px;
      padding: 26px 30px;
      box-shadow: var(--chassis-shadow);
      position: relative;
      overflow: hidden;
    }

    .chassis::before, .chassis::after {
      content: '';
      position: absolute;
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: radial-gradient(circle, #666 40%, #222 100%);
      box-shadow: inset 0 1px 1px #fff, 0 1px 2px rgba(0,0,0,0.8);
    }
    .chassis::before { top: 12px; left: 12px; }
    .chassis::after { bottom: 12px; right: 12px; }

    .board-header-bar {
      display: none;
      grid-template-columns: 88px 1fr 68px 74px 106px;
      gap: 12px;
      padding: 0 4px 12px 4px;
      border-bottom: 2px solid var(--chassis-border);
      margin-bottom: 16px;
      font-size: 11px;
      font-weight: 800;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      color: var(--accent);
    }

    .board-header-bar.visible {
      display: grid;
    }

    .board-grid {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .board-row {
      display: flex;
      gap: 5px;
      align-items: center;
      justify-content: center;
    }

    /* Split-Flap Cell Unit */
    .flap-unit {
      position: relative;
      width: 42px;
      height: 60px;
      perspective: 350px;
      background: #0a0b0f;
      border-radius: 5px;
      box-shadow: 0 4px 8px rgba(0, 0, 0, 0.7);
    }

    .flap-half {
      position: absolute;
      left: 0;
      width: 100%;
      height: 50%;
      overflow: hidden;
      box-sizing: border-box;
      backface-visibility: hidden;
      -webkit-backface-visibility: hidden;
    }

    .flap-half-inner {
      position: absolute;
      left: 0;
      width: 100%;
      height: 60px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Helvetica Neue', Arial, sans-serif;
      font-weight: 800;
      font-size: 40px;
      color: var(--flap-text);
      text-transform: uppercase;
      line-height: 60px;
    }

    .flap-top {
      top: 0;
      border-radius: 5px 5px 0 0;
      background: var(--flap-top-bg);
      border-top: 1px solid rgba(255, 255, 255, 0.08);
      border-bottom: 1px solid #000;
      transform-origin: bottom center;
    }

    .flap-top .flap-half-inner {
      top: 0;
    }

    .flap-bot {
      bottom: 0;
      border-radius: 0 0 5px 5px;
      background: var(--flap-bot-bg);
      border-top: 1px solid #000;
      transform-origin: top center;
    }

    .flap-bot .flap-half-inner {
      top: -30px;
    }

    .flap-falling {
      z-index: 3;
      transform-origin: bottom center;
      transition: transform var(--flip-speed, 0.07s) linear;
    }

    .flap-rising {
      z-index: 2;
      transform-origin: top center;
      transform: rotateX(90deg);
      transition: transform var(--flip-speed, 0.07s) cubic-bezier(0.175, 0.885, 0.32, 1.25);
    }

    .flap-unit::before, .flap-unit::after {
      content: '';
      position: absolute;
      top: calc(50% - 3px);
      width: 3px;
      height: 6px;
      background: var(--hinge-notch);
      z-index: 10;
      border-radius: 1px;
    }
    .flap-unit::before { left: -1.5px; }
    .flap-unit::after { right: -1.5px; }

    /* Interactive Live Typewriter Bar */
    .composer-container {
      width: 100%;
      max-width: 1080px;
      margin-top: 16px;
      display: flex;
      gap: 10px;
    }

    .composer-input-wrapper {
      position: relative;
      flex: 1;
      display: flex;
      align-items: center;
    }

    .composer-input-wrapper input {
      width: 100%;
      padding: 12px 18px;
      background: var(--panel-bg);
      border: 1px solid var(--border-color);
      border-radius: 14px;
      color: var(--text-main);
      font-size: 14px;
      font-weight: 500;
      text-transform: uppercase;
      outline: none;
      transition: border-color 0.2s ease, box-shadow 0.2s ease;
    }

    .composer-input-wrapper input:focus {
      border-color: var(--accent);
      box-shadow: 0 0 14px var(--accent-glow);
    }

    .composer-btn {
      background: var(--accent);
      color: #000;
      font-weight: 700;
      border: none;
      padding: 0 20px;
      border-radius: 14px;
      font-size: 13px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      box-shadow: 0 4px 14px var(--accent-glow);
      transition: all 0.2s ease;
    }

    .composer-btn:hover {
      opacity: 0.92;
      transform: translateY(-1px);
    }

    /* Bottom Control Bar */
    .bottom-bar {
      width: 100%;
      max-width: 1080px;
      margin-top: 18px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 14px;
      padding: 0 4px;
    }

    .btn-group {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }

    .btn-secondary {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--border-color);
      color: var(--text-main);
      padding: 8px 14px;
      border-radius: 11px;
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 7px;
      transition: all 0.2s ease;
    }

    .btn-secondary:hover {
      background: rgba(255, 255, 255, 0.1);
      transform: translateY(-1px);
    }

    .control-item {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 12px;
      color: var(--text-muted);
    }

    select {
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid var(--border-color);
      color: var(--text-main);
      padding: 7px 11px;
      border-radius: 9px;
      font-size: 12px;
      outline: none;
      cursor: pointer;
    }

    select option {
      background: #14161f;
      color: #fff;
    }

    .info-bar {
      margin-top: 18px;
      font-size: 12px;
      color: var(--text-muted);
      display: flex;
      gap: 20px;
      align-items: center;
      flex-wrap: wrap;
      justify-content: center;
    }

    .kbd-tag {
      background: rgba(255, 255, 255, 0.07);
      border: 1px solid var(--border-color);
      padding: 2px 6px;
      border-radius: 5px;
      font-size: 10px;
      font-family: inherit;
      color: var(--text-main);
    }

    /* Responsive scaling */
    @media (max-width: 1100px) {
      .flap-unit {
        width: 34px;
        height: 50px;
      }
      .flap-half-inner {
        height: 50px;
        font-size: 34px;
        line-height: 50px;
      }
      .flap-bot .flap-half-inner {
        top: -25px;
      }
      .giant-unit {
        width: 85px;
        height: 120px;
      }
      .giant-unit .flap-half-inner {
        height: 120px;
        font-size: 88px;
        line-height: 120px;
      }
      .giant-unit .flap-bot .flap-half-inner {
        top: -60px;
      }
    }

    @media (max-width: 860px) {
      body {
        padding: 14px;
      }
      .flap-unit {
        width: 24px;
        height: 36px;
      }
      .flap-half-inner {
        height: 36px;
        font-size: 23px;
        line-height: 36px;
      }
      .flap-bot .flap-half-inner {
        top: -18px;
      }
      .board-row {
        gap: 3px;
      }
      .giant-unit {
        width: 58px;
        height: 86px;
      }
      .giant-unit .flap-half-inner {
        height: 86px;
        font-size: 60px;
        line-height: 86px;
      }
      .giant-unit .flap-bot .flap-half-inner {
        top: -43px;
      }
      .giant-clock-view {
        padding: 22px 24px;
      }
      .mode-switcher {
        flex-wrap: wrap;
        justify-content: center;
      }
      .bottom-bar {
        flex-direction: column;
        align-items: stretch;
      }
      .btn-group {
        justify-content: center;
      }
    }

    @media (max-width: 580px) {
      .flap-unit {
        width: 14.5px;
        height: 24px;
        border-radius: 3px;
      }
      .flap-half-inner {
        height: 24px;
        font-size: 15px;
        line-height: 24px;
      }
      .flap-bot .flap-half-inner {
        top: -12px;
      }
      .board-row {
        gap: 2px;
      }
      .board-grid {
        gap: 6px;
      }
      .giant-unit {
        width: 38px;
        height: 56px;
        border-radius: 6px;
      }
      .giant-unit .flap-half-inner {
        height: 56px;
        font-size: 38px;
        line-height: 56px;
      }
      .giant-unit .flap-bot .flap-half-inner {
        top: -28px;
      }
      .giant-colon-dot {
        width: 6px;
        height: 6px;
      }
      .giant-ampm-tag {
        font-size: 12px;
        padding: 4px 8px;
      }
    }
  </style>
</head>
<body data-theme="noir">

  <header>
    <div class="brand">
      <h1>Solari Board</h1>
      <span>Mechanical Split-Flap System</span>
    </div>
    <div class="header-indicators">
      <div class="mode-pill">
        <span class="live-dot"></span>
        <span id="active-mode-label">Giant Flip Clock</span>
      </div>
      <div id="live-time-mini" style="font-feature-settings: 'tnum'; font-variant-numeric: tabular-nums; font-weight: 700;">
        --:--:--
      </div>
    </div>
  </header>

  <!-- Clear Mode Tabs -->
  <nav class="mode-switcher">
    <button class="tab-btn active" id="tab-giant">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <circle cx="12" cy="12" r="10"></circle>
        <polyline points="12 6 12 12 16 14"></polyline>
      </svg>
      Giant Flip Clock
    </button>
    <button class="tab-btn" id="tab-station">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <rect x="3" y="4" width="18" height="16" rx="2"></rect>
        <line x1="7" y1="8" x2="17" y2="8"></line>
        <line x1="7" y1="12" x2="17" y2="12"></line>
        <line x1="7" y1="16" x2="17" y2="16"></line>
      </svg>
      Station Calendar
    </button>
    <button class="tab-btn" id="tab-flights">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M17.8 19.2L16 11l3.5-3.5C21 6 21.5 4 21 3c-1-.5-3 0-4.5 1.5L13 8 4.8 6.2c-.5-.1-.9.1-1.1.5l-.3.5c-.2.5-.1 1 .3 1.3L9 12l-2 3H4l-1 1 3 2 2 3 1-1v-3l3-2 3.5 5.3c.3.4.8.5 1.3.3l.5-.2c.4-.3.6-.7.5-1.2z"></path>
      </svg>
      Flight Board
    </button>
    <button class="tab-btn" id="tab-composer">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <rect x="2" y="4" width="20" height="16" rx="2"></rect>
        <path d="M6 8h.01M10 8h.01M14 8h.01M18 8h.01M8 12h.01M12 12h.01M16 12h.01M7 16h10"></path>
      </svg>
      Live Typewriter
    </button>
    <button class="tab-btn" id="tab-quotes">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M3 21c3 0 7-1 7-8V5c0-1.25-.75-2-2-2H4c-1.25 0-2 .75-2 2v6c0 1.25.75 2 2 2h3c0 4-2 6-4 6v2zm13 0c3 0 7-1 7-8V5c0-1.25-.75-2-2-2h-4c-1.25 0-2 .75-2 2v6c0 1.25.75 2 2 2h3c0 4-2 6-4 6v2z"></path>
      </svg>
      Quotes
    </button>
  </nav>

  <!-- VIEW 1: GIANT VINTAGE FLIP CLOCK -->
  <section class="giant-clock-view" id="giant-clock-view">
    <div class="giant-date-bar">
      <span id="giant-day-name">FRIDAY</span>
      <span>•</span>
      <span id="giant-date-str">OCTOBER 02, 2026</span>
    </div>

    <div class="giant-digits-row">
      <!-- Hours (2 digits) -->
      <div id="giant-h1"></div>
      <div id="giant-h2"></div>

      <!-- Colon -->
      <div class="giant-colon">
        <div class="giant-colon-dot"></div>
        <div class="giant-colon-dot"></div>
      </div>

      <!-- Minutes (2 digits) -->
      <div id="giant-m1"></div>
      <div id="giant-m2"></div>

      <!-- Colon -->
      <div class="giant-colon">
        <div class="giant-colon-dot"></div>
        <div class="giant-colon-dot"></div>
      </div>

      <!-- Seconds (2 digits) -->
      <div id="giant-s1"></div>
      <div id="giant-s2"></div>

      <!-- AM / PM tag -->
      <div class="giant-ampm-tag" id="giant-ampm">AM</div>
    </div>

    <div class="giant-caption">Grand Central Mechanical Timepiece</div>
  </section>

  <!-- VIEW 2: MULTI-LINE SOLARI BOARD -->
  <main class="matrix-board-view" id="matrix-board-view">
    <div class="chassis">

        <!-- 6 rows x 22 columns of physical split-flap cells -->

  <!-- Interactive Live Typewriter Bar -->
  <div class="composer-container" id="composer-area">
    <div class="composer-input-wrapper">
      <input type="text" id="live-input" placeholder="Type here: letters will flip live on the board..." maxlength="132" autocomplete="off" spellcheck="false">
    </div>
    <button class="composer-btn" id="btn-cascade">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <polygon points="5 3 19 12 5 21 5 3"></polygon>
      </svg>
      Cascade Flip
    </button>
  </div>

  <div class="bottom-bar">
    <div class="btn-group">
      <button class="btn-secondary" id="btn-shuffle" title="Cascade shuffle all flaps">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <polyline points="16 3 21 3 21 8"></polyline>
          <line x1="4" y1="20" x2="21" y2="3"></line>
          <polyline points="21 16 21 21 16 21"></polyline>
          <line x1="15" y1="15" x2="21" y2="21"></line>
          <line x1="4" y1="4" x2="9" y2="9"></line>
        </svg>
        Shuffle
      </button>

      <div class="control-item">
        <label for="theme-select">Theme</label>
        <select id="theme-select">
          <option value="noir" selected>Classic Noir</option>
          <option value="railway">Geneva Railway</option>
          <option value="bronze">Grand Central</option>
          <option value="cyber">Cyberpunk</option>
        </select>
      </div>

      <div class="control-item">
        <label for="format-select">Format</label>
        <select id="format-select">
          <option value="12" selected>12-Hour (AM/PM)</option>

    <div class="btn-group">
      <button class="btn-secondary active" id="btn-sound" title="Toggle mechanical audio">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon>
          <path d="M19.07 4.93a10 10 0 0 1 0 14.14M15.54 8.46a5 5 0 0 1 0 7.07"></path>
        </svg>
        Sound On
      </button>

      <button class="btn-secondary" id="btn-fullscreen" title="Toggle fullscreen view">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M8 3H5a2 2 0 0 0-2 2v3m18 0V5a2 2 0 0 0-2-2h-3m0 18h3a2 2 0 0 0 2-2v-3M3 16v3a2 2 0 0 0 2 2h3"></path>
        </svg>
        Fullscreen
      </button>
    </div>
  </div>

  <div class="info-bar">
    <span><kbd class="kbd-tag">Space</kbd> Shuffle Cascade</span>
    <span><kbd class="kbd-tag">T</kbd> Next Theme</span>
    <span><kbd class="kbd-tag">M</kbd> Mute / Unmute</span>
    <span><kbd class="kbd-tag">F</kbd> Fullscreen</span>
    <span>Mechanical Solari di Udine Simulation</span>
  </div>

  <script>
    /* ==========================================================================
       MECHANICAL SOLARI SPLIT-FLAP SYSTEM
       ========================================================================== */

    const CHAR_SET = " ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789.:-/'\"!?#$*&";

    const FLIGHT_SCHEDULES = [
      [
        "BA 178  LONDON LHR    B12 10:45 ON TIME   ",
        "AF 022  PARIS CDG     C04 11:15 BOARDING  ",
        "EK 204  DUBAI DXB     A18 11:30 ON TIME   ",
        "JL 006  TOKYO HND     D09 11:55 DELAYED   ",
        "SQ 026  SINGAPORE SIN B22 12:10 GATE OPEN ",
        "LH 400  FRANKFURT FRA A05 12:35 ON TIME   "
      ],
      [
        "BA 178  LONDON LHR    B12 10:45 DEPARTED  ",
        "AF 022  PARIS CDG     C04 11:15 LAST CALL ",
        "EK 204  DUBAI DXB     A18 11:30 BOARDING  ",
        "JL 006  TOKYO HND     D09 12:20 RESCHED   ",
        "SQ 026  SINGAPORE SIN B22 12:10 BOARDING  ",
        "QF 012  SYDNEY SYD    E02 12:50 ON TIME   "
      ],
      [
        "LX 016  ZURICH ZRH    A08 13:00 ON TIME   ",
        "DL 106  NEW YORK JFK  B14 13:15 ON TIME   ",
        "CX 888  HONG KONG HKG C11 13:40 BOARDING  ",
        "UA 837  SAN FRANCISCO D03 14:05 ON TIME   ",
        "KL 642  AMSTERDAM AMS A12 14:25 GATE OPEN ",
        "QR 701  DOHA DOH      B07 14:50 ON TIME   "
      ]
    ];

    const QUOTES = [
      [
        "  NOT ALL THOSE WHO   ",
        "   WANDER ARE LOST    ",
        "                      ",
        "      J.R.R. TOLKIEN  ",
        "                      ",
        "                      "
      ],
      [
        " THE JOURNEY OF A     ",
        " THOUSAND MILES       ",
        " BEGINS WITH A        ",
        " SINGLE STEP          ",
        "             LAO TZU  ",
        "                      "
      ],
      [
        " TIME WAITS FOR       ",
        " NO ONE.              ",
        "                      ",
        " MAKE EVERY SECOND    ",
        " COUNT.               ",
        "                      "
      ]
    ];

    // Procedural Mechanical Sound Synthesizer
    class SplitFlapAudio {
      constructor() {
        this.ctx = null;
        this.enabled = true;
        this.lastClick = 0;
      }

      init() {
        if (!this.ctx) {
          const AudioContext = window.AudioContext || window.webkitAudioContext;
          this.ctx = new AudioContext();
        }
        if (this.ctx.state === 'suspended') {
          this.ctx.resume();
        }
      }

      toggle() {
        this.enabled = !this.enabled;
        if (this.enabled) this.init();
        return this.enabled;
      }

      playClick() {
        if (!this.enabled) return;
        this.init();

        const now = this.ctx.currentTime;
        if (now - this.lastClick < 0.007) return;
        this.lastClick = now;

        // 1. High transient mechanical snap
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        const randFreq = 1450 + (Math.random() * 350 - 175);

        osc.type = 'triangle';
        osc.frequency.setValueAtTime(randFreq, now);
        osc.frequency.exponentialRampToValueAtTime(70, now + 0.024);

        gain.gain.setValueAtTime(0.04, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.024);

        osc.connect(gain);
        gain.connect(this.ctx.destination);

        osc.start(now);
        osc.stop(now + 0.024);

        // 2. Plastic stopper thud
        const thud = this.ctx.createOscillator();
        const thudGain = this.ctx.createGain();
        thud.type = 'sine';
        thud.frequency.setValueAtTime(150 + (Math.random() * 30 - 15), now);
        thud.frequency.exponentialRampToValueAtTime(30, now + 0.035);

        thudGain.gain.setValueAtTime(0.05, now);
        thudGain.gain.exponentialRampToValueAtTime(0.001, now + 0.035);

        thud.connect(thudGain);
        thudGain.connect(this.ctx.destination);

        thud.start(now);
        thud.stop(now + 0.035);
      }
    }

    const audio = new SplitFlapAudio();

    // Universal Flap Cell Component (Works for both Matrix and Giant views)
    class FlapUnit {
      constructor(customClass = '') {
        this.currentChar = ' ';
        this.targetChar = ' ';
        this.isFlipping = false;
        this.customClass = customClass;

        this.el = null;
        this.topStatic = null;
        this.botStatic = null;
        this.topFalling = null;
        this.botRising = null;

        this.createDOM();
      }

      createDOM() {
        const unit = document.createElement('div');
        unit.className = `flap-unit ${this.customClass}`;

        this.topStatic = this.createHalf('flap-top');
        this.botStatic = this.createHalf('flap-bot');
        this.topFalling = this.createHalf('flap-top flap-falling');
        this.botRising = this.createHalf('flap-bot flap-rising');

        unit.appendChild(this.topStatic);
        unit.appendChild(this.botStatic);
        unit.appendChild(this.topFalling);
        unit.appendChild(this.botRising);

        this.el = unit;
        this.setCharDirect(' ');
      }

      createHalf(className) {
        const half = document.createElement('div');
        half.className = `flap-half ${className}`;
        const inner = document.createElement('div');
        inner.className = 'flap-half-inner';
        inner.innerText = ' ';
        half.appendChild(inner);
        return half;
      }

      setCharDirect(char) {
        this.currentChar = char;
        this.targetChar = char;
        this.topStatic.firstElementChild.innerText = char;
        this.botStatic.firstElementChild.innerText = char;
        this.topFalling.firstElementChild.innerText = char;
        this.botRising.firstElementChild.innerText = char;
      }

      flipTo(targetChar, speedMs = 65) {
        this.targetChar = targetChar.toUpperCase();
        if (this.isFlipping) return;
        this.stepFlip(speedMs);
      }

      stepFlip(speedMs) {
        if (this.currentChar === this.targetChar) {
          this.isFlipping = false;
          return;
        }

        this.isFlipping = true;
        const curIdx = CHAR_SET.indexOf(this.currentChar);
        const nextIdx = (curIdx + 1) % CHAR_SET.length;
        const nextChar = CHAR_SET[nextIdx];

        this.topStatic.firstElementChild.innerText = nextChar;
        this.botRising.firstElementChild.innerText = nextChar;

        this.topFalling.style.transition = `transform ${speedMs * 0.5}ms ease-in`;
        this.botRising.style.transition = `transform ${speedMs * 0.5}ms cubic-bezier(0.175, 0.885, 0.32, 1.25)`;

        this.topFalling.style.transform = 'rotateX(-90deg)';

        setTimeout(() => {
          audio.playClick();
          this.botRising.style.transform = 'rotateX(0deg)';

          setTimeout(() => {
            this.currentChar = nextChar;
            this.setCharDirect(nextChar);

            this.topFalling.style.transition = 'none';
            this.botRising.style.transition = 'none';
            this.topFalling.style.transform = 'rotateX(0deg)';
            this.botRising.style.transform = 'rotateX(90deg)';

            if (this.currentChar !== this.targetChar) {
              setTimeout(() => this.stepFlip(speedMs), 6);
            } else {
              this.isFlipping = false;
            }
          }, speedMs * 0.5);
        }, speedMs * 0.5);
      }
    }

    // Master Controller
    class MasterBoard {
      constructor(rows = 6, cols = 22) {
        this.rows = rows;
        this.cols = cols;
        this.grid = [];
        this.giantDigits = {};
        this.mode = 'giant'; // 'giant' (default!), 'station', 'flights', 'composer', 'quotes'
        this.timeFormat = '12';
        this.speedMs = 65;
        this.flightIndex = 0;
        this.quoteIndex = 0;
        this.autoInterval = null;
        this.lastClockMinute = -1;

        this.boardGridEl = document.getElementById('board-grid');
        this.flightHeaderEl = document.getElementById('flight-header');
        this.modeLabelEl = document.getElementById('active-mode-label');
        this.liveTimeMiniEl = document.getElementById('live-time-mini');

        this.giantClockView = document.getElementById('giant-clock-view');
        this.matrixBoardView = document.getElementById('matrix-board-view');

        this.initDOM();
        this.initGiantClock();
        this.initEvents();
        this.setMode('giant');
        this.startClockTimer();
      }

      initDOM() {
        this.boardGridEl.innerHTML = '';
        this.grid = [];

        for (let r = 0; r < this.rows; r++) {
          const rowEl = document.createElement('div');
          rowEl.className = 'board-row';
          const rowUnits = [];

          for (let c = 0; c < this.cols; c++) {
            const unit = new FlapUnit('');
            rowEl.appendChild(unit.el);
            rowUnits.push(unit);
          }

          this.boardGridEl.appendChild(rowEl);
          this.grid.push(rowUnits);
        }
      }

      initGiantClock() {
        const slots = ['h1', 'h2', 'm1', 'm2', 's1', 's2'];
        slots.forEach(slot => {
          const container = document.getElementById(`giant-${slot}`);
          const unit = new FlapUnit('giant-unit');
          container.appendChild(unit.el);
          this.giantDigits[slot] = unit;
        });
      }

      initEvents() {
        const tabGiant = document.getElementById('tab-giant');
        const tabStation = document.getElementById('tab-station');
        const tabFlights = document.getElementById('tab-flights');
        const tabComposer = document.getElementById('tab-composer');
        const tabQuotes = document.getElementById('tab-quotes');
        const allTabs = [tabGiant, tabStation, tabFlights, tabComposer, tabQuotes];

        const activateTab = (active) => {
          allTabs.forEach(t => t.classList.remove('active'));
          active.classList.add('active');
        };

        tabGiant.addEventListener('click', () => {
          activateTab(tabGiant);
          this.setMode('giant');
        });

        tabStation.addEventListener('click', () => {
          activateTab(tabStation);
          this.setMode('station');
        });

        tabFlights.addEventListener('click', () => {
          activateTab(tabFlights);
          this.setMode('flights');
        });

        tabComposer.addEventListener('click', () => {
          activateTab(tabComposer);
          this.setMode('composer');
          document.getElementById('live-input').focus();
        });

        tabQuotes.addEventListener('click', () => {
          activateTab(tabQuotes);
          this.setMode('quotes');
        });

        // Live Typewriter Input
        const liveInput = document.getElementById('live-input');
        liveInput.addEventListener('input', (e) => {
          if (this.mode !== 'composer') {
            activateTab(tabComposer);
            this.setMode('composer');
          }
          this.renderCustomText(e.target.value);
        });

        document.getElementById('btn-cascade').addEventListener('click', () => {
          const text = liveInput.value.trim() || 'WELCOME TO SOLARI';
          activateTab(tabComposer);
          this.setMode('composer');
          this.renderCustomText(text);
        });

        // Theme selector
        document.getElementById('theme-select').addEventListener('change', (e) => {
          document.body.dataset.theme = e.target.value;
        });

        // Format selector (12h vs 24h)
        document.getElementById('format-select').addEventListener('change', (e) => {
          this.timeFormat = e.target.value;
          this.updateClockTick(new Date());
          if (this.mode === 'station') this.renderStationCalendar(new Date(), true);
        });

        // Shuffle button
        document.getElementById('btn-shuffle').addEventListener('click', () => {
          this.cascadeShuffle();
        });

        // Sound button
        const btnSound = document.getElementById('btn-sound');
        btnSound.addEventListener('click', () => {
          const isNowOn = audio.toggle();
          btnSound.classList.toggle('active', isNowOn);
          btnSound.innerHTML = isNowOn
            ? `<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon><path d="M19.07 4.93a10 10 0 0 1 0 14.14M15.54 8.46a5 5 0 0 1 0 7.07"></path></svg> Sound On`
            : `<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon><line x1="23" y1="9" x2="17" y2="15"></line><line x1="17" y1="9" x2="23" y2="15"></line></svg> Sound Off`;
        });

        // Fullscreen
        document.getElementById('btn-fullscreen').addEventListener('click', () => {
          if (!document.fullscreenElement) {
            document.documentElement.requestFullscreen().catch(() => {});
          } else {
            document.exitFullscreen();
          }
        });

        // Keyboard shortcuts
        window.addEventListener('keydown', (e) => {
          if (e.target.tagName === 'INPUT' || e.target.tagName === 'SELECT') return;
          if (e.code === 'Space') {
            e.preventDefault();
            this.cascadeShuffle();
          } else if (e.key === 't' || e.key === 'T') {
            const themes = ['noir', 'railway', 'bronze', 'cyber'];
            const cur = document.body.dataset.theme || 'noir';
            const next = themes[(themes.indexOf(cur) + 1) % themes.length];
            document.body.dataset.theme = next;
            document.getElementById('theme-select').value = next;
          } else if (e.key === 'm' || e.key === 'M') {
            document.getElementById('btn-sound').click();
          } else if (e.key === 'f' || e.key === 'F') {
            document.getElementById('btn-fullscreen').click();
          }
        });
      }

      startClockTimer() {
        setInterval(() => {
          const now = new Date();
          this.updateClockTick(now);
        }, 1000);
        this.updateClockTick(new Date());
      }

      updateClockTick(now) {
        let rawH = now.getHours();
        const m = now.getMinutes();
        const s = now.getSeconds();
        const ampm = rawH >= 12 ? 'PM' : 'AM';

        let displayH = rawH;
        if (this.timeFormat === '12') {
          displayH = rawH % 12 || 12; // 0 becomes 12 at midnight!
        }

        const hStr = String(displayH).padStart(2, '0');
        const mStr = String(m).padStart(2, '0');
        const sStr = String(s).padStart(2, '0');

        // Header mini indicator
        this.liveTimeMiniEl.innerText = `${hStr}:${mStr}:${sStr} ${this.timeFormat === '12' ? ampm : ''}`;

        // Giant clock update
        if (this.mode === 'giant') {
          this.giantDigits.h1.flipTo(hStr[0], 55);
          this.giantDigits.h2.flipTo(hStr[1], 55);
          this.giantDigits.m1.flipTo(mStr[0], 55);
          this.giantDigits.m2.flipTo(mStr[1], 55);
          this.giantDigits.s1.flipTo(sStr[0], 45);
          this.giantDigits.s2.flipTo(sStr[1], 45);

          document.getElementById('giant-ampm').innerText = this.timeFormat === '12' ? ampm : '24H';

          const days = ['SUNDAY', 'MONDAY', 'TUESDAY', 'WEDNESDAY', 'THURSDAY', 'FRIDAY', 'SATURDAY'];
          const months = ['JANUARY', 'FEBRUARY', 'MARCH', 'APRIL', 'MAY', 'JUNE', 'JULY', 'AUGUST', 'SEPTEMBER', 'OCTOBER', 'NOVEMBER', 'DECEMBER'];
          document.getElementById('giant-day-name').innerText = days[now.getDay()];
          document.getElementById('giant-date-str').innerText = `${months[now.getMonth()]} ${String(now.getDate()).padStart(2, '0')}, ${now.getFullYear()}`;
        }

        // Station matrix clock update on minute flip
        if (this.mode === 'station' && now.getMinutes() !== this.lastClockMinute) {
          this.lastClockMinute = now.getMinutes();
          this.renderStationCalendar(now);
        }
      }

      setMode(newMode) {
        this.mode = newMode;
        clearInterval(this.autoInterval);

        if (newMode === 'giant') {
          this.giantClockView.classList.remove('hidden');
          this.matrixBoardView.classList.remove('active');
          this.modeLabelEl.innerText = 'Giant Flip Clock';
          this.updateClockTick(new Date());
        } else {
          this.giantClockView.classList.add('hidden');
          this.matrixBoardView.classList.add('active');

          if (newMode === 'station') {
            this.flightHeaderEl.classList.remove('visible');
            this.modeLabelEl.innerText = 'Station Calendar';
            this.lastClockMinute = -1;
            this.renderStationCalendar(new Date(), true);
          } else if (newMode === 'flights') {
            this.flightHeaderEl.classList.add('visible');
            this.modeLabelEl.innerText = 'Airport Departures';
            this.renderFlights(this.flightIndex);
            this.autoInterval = setInterval(() => {
              this.flightIndex = (this.flightIndex + 1) % FLIGHT_SCHEDULES.length;
              this.renderFlights(this.flightIndex);
            }, 20000);
          } else if (newMode === 'quotes') {
            this.flightHeaderEl.classList.remove('visible');
            this.modeLabelEl.innerText = 'Inspiration';
            this.renderQuote(this.quoteIndex);
            this.autoInterval = setInterval(() => {
              this.quoteIndex = (this.quoteIndex + 1) % QUOTES.length;
              this.renderQuote(this.quoteIndex);
            }, 18000);
          } else if (newMode === 'composer') {
            this.flightHeaderEl.classList.remove('visible');
            this.modeLabelEl.innerText = 'Live Typewriter';
            const inputVal = document.getElementById('live-input').value.trim();
            this.renderCustomText(inputVal || 'TYPE ANY MESSAGE...');
          }
        }
      }

      centerLine(text) {
        const str = text.trim();
        const pad = Math.max(0, Math.floor((this.cols - str.length) / 2));
        return ' '.repeat(pad) + str + ' '.repeat(Math.max(0, this.cols - pad - str.length));
      }

      renderStationCalendar(now, instant = false) {
        const days = ['SUNDAY', 'MONDAY', 'TUESDAY', 'WEDNESDAY', 'THURSDAY', 'FRIDAY', 'SATURDAY'];
        const months = ['JANUARY', 'FEBRUARY', 'MARCH', 'APRIL', 'MAY', 'JUNE', 'JULY', 'AUGUST', 'SEPTEMBER', 'OCTOBER', 'NOVEMBER', 'DECEMBER'];

        const dayName = days[now.getDay()];
        const monthName = months[now.getMonth()];
        const dateNum = String(now.getDate()).padStart(2, '0');
        const year = now.getFullYear();

        let rawH = now.getHours();
        let displayH = this.timeFormat === '12' ? (rawH % 12 || 12) : rawH;
        const h = String(displayH).padStart(2, '0');
        const m = String(now.getMinutes()).padStart(2, '0');
        const ampm = this.timeFormat === '12' ? (rawH >= 12 ? 'PM' : 'AM') : '';

        const lines = [
          this.centerLine('* GRAND CENTRAL TIME *'),
          this.centerLine(dayName),
          this.centerLine(`${monthName} ${dateNum}, ${year}`),
          this.centerLine(''),
          this.centerLine(`${h}:${m} ${ampm}`.trim()),
          this.centerLine('LOCAL STATION CLOCK')
        ];

        for (let r = 0; r < this.rows; r++) {
          this.setRowText(r, lines[r], instant ? 0 : r * 120);
        }
      }

      renderFlights(idx) {
        const schedule = FLIGHT_SCHEDULES[idx];
        for (let r = 0; r < this.rows; r++) {
          this.setRowText(r, schedule[r] || '', r * 130);
        }
      }

      renderQuote(idx) {
        const quote = QUOTES[idx];
        for (let r = 0; r < this.rows; r++) {
          this.setRowText(r, quote[r] || '', r * 120);
        }
      }

      renderCustomText(text) {
        const clean = text.toUpperCase();
        const words = clean.split(' ');
        const lines = ['', '', '', '', '', ''];
        let lineIdx = 0;

        for (const w of words) {
          if (lineIdx >= this.rows) break;
          if ((lines[lineIdx] + ' ' + w).trim().length <= this.cols) {
            lines[lineIdx] = (lines[lineIdx] + ' ' + w).trim();
          } else {
            lineIdx++;
            if (lineIdx < this.rows) lines[lineIdx] = w;
          }
        }

        for (let r = 0; r < this.rows; r++) {
          this.setRowText(r, this.centerLine(lines[r]), 0);
        }
      }

      setRowText(r, text, delayMs = 0) {
        const padded = text.padEnd(this.cols, ' ').substring(0, this.cols);
        setTimeout(() => {
          for (let c = 0; c < this.cols; c++) {
            const unit = this.grid[r][c];
            const targetChar = padded[c] || ' ';
            const stagger = c * 20;
            setTimeout(() => {
              unit.flipTo(targetChar, this.speedMs);
            }, stagger);
          }
        }, delayMs);
      }

      cascadeShuffle() {
        if (this.mode === 'giant') {
          const slots = ['h1', 'h2', 'm1', 'm2', 's1', 's2'];
          slots.forEach((s, idx) => {
            const randDigit = String(Math.floor(Math.random() * 10));
            setTimeout(() => this.giantDigits[s].flipTo(randDigit, 45), idx * 60);
          });
        } else {
          for (let r = 0; r < this.rows; r++) {
            for (let c = 0; c < this.cols; c++) {
              const unit = this.grid[r][c];
              const randChar = CHAR_SET[Math.floor(Math.random() * CHAR_SET.length)];
              setTimeout(() => {
                unit.flipTo(randChar, 45);
              }, (c + r * 2) * 26);
            }
          }
        }
      }
    }

    window.addEventListener('DOMContentLoaded', () => {
      new MasterBoard(6, 22);
    });
  </script>
