<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Solari Split-Flap Display Board</title>
  <style>
    :root {
      --bg: #0d0f14;
      --chassis-bg: #151821;
      --chassis-border: #222736;
      --chassis-shadow: 0 30px 90px rgba(0, 0, 0, 0.9), inset 0 2px 4px rgba(255, 255, 255, 0.04);
      --flap-bg: #12141a;
      --flap-gradient-top: linear-gradient(180deg, #1e222d 0%, #151720 100%);
      --flap-gradient-bot: linear-gradient(180deg, #13151d 0%, #0e1017 100%);
      --flap-text: #f0f3f8;
      --flap-border: #0a0b0f;
      --hinge-line: #06070a;
      --accent: #f59e0b;
      --accent-glow: rgba(245, 158, 11, 0.35);
      --panel-bg: rgba(21, 24, 33, 0.9);
      --border-color: rgba(255, 255, 255, 0.08);
      --text-main: #e2e8f0;
      --text-muted: #64748b;
      --header-bg: #0a0b0f;
      --header-text: #f59e0b;
      --highlight: rgba(255, 255, 255, 0.06);
    }

    [data-theme="railway"] {
      --bg: #14130e;
      --chassis-bg: #1f1d16;
      --chassis-border: #332f22;
      --flap-bg: #181611;
      --flap-gradient-top: linear-gradient(180deg, #2a261c 0%, #1c1a13 100%);
      --flap-gradient-bot: linear-gradient(180deg, #181610 0%, #11100b 100%);
      --flap-text: #ffd13b;
      --flap-border: #0d0c08;
      --hinge-line: #070604;
      --accent: #ffd13b;
      --accent-glow: rgba(255, 209, 59, 0.35);
      --header-bg: #292415;
      --header-text: #ffffff;
    }

    [data-theme="bronze"] {
      --bg: #0f1412;
      --chassis-bg: #16201c;
      --chassis-border: #23332d;
      --flap-bg: #101614;
      --flap-gradient-top: linear-gradient(180deg, #1a2722 0%, #141d19 100%);
      --flap-gradient-bot: linear-gradient(180deg, #121916 0%, #0d1210 100%);
      --flap-text: #eae6d9;
      --flap-border: #0a0e0c;
      --hinge-line: #050807;
      --accent: #5eead4;
      --accent-glow: rgba(94, 234, 212, 0.35);
      --header-bg: #111815;
      --header-text: #5eead4;
    }

    [data-theme="cyber"] {
      --bg: #03060f;
      --chassis-bg: #070d1e;
      --chassis-border: #0e1b3d;
      --flap-bg: #040814;
      --flap-gradient-top: linear-gradient(180deg, #0b1530 0%, #060c1d 100%);
      --flap-gradient-bot: linear-gradient(180deg, #050a19 0%, #030610 100%);
      --flap-text: #00f3ff;
      --flap-border: #02040a;
      --hinge-line: #010205;
      --accent: #00f3ff;
      --accent-glow: rgba(0, 243, 255, 0.4);
      --header-bg: #050914;
      --header-text: #ff007f;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', Roboto, sans-serif;
      background: var(--bg);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
      overflow-x: hidden;
      transition: background 0.4s ease, color 0.4s ease;
    }

    /* Top Navigation / Brand */
    header {
      width: 100%;
      max-width: 1120px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 22px;
      padding: 0 4px;
    }

    .brand {
      display: flex;
      align-items: baseline;
      gap: 12px;
    }

    .brand h1 {
      font-size: 21px;
      font-weight: 700;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: var(--text-main);
    }

    .brand span {
      font-size: 11px;
      color: var(--text-muted);
      letter-spacing: 1.5px;
      text-transform: uppercase;
      font-weight: 500;
    }

    .header-indicators {
      display: flex;
      align-items: center;
      gap: 16px;
      font-size: 13px;
      color: var(--text-muted);
    }

    .live-tag {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      padding: 5px 12px;
      border-radius: 20px;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--border-color);
      font-size: 11px;
      letter-spacing: 1px;
      text-transform: uppercase;
      font-weight: 600;
    }

    .live-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #10b981;
      box-shadow: 0 0 8px #10b981;
      animation: pulse 2s infinite ease-in-out;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.35; transform: scale(0.85); }
    }

    /* Split-Flap Board Chassis */
    .chassis-wrapper {
      position: relative;
      max-width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .chassis {
      background: var(--chassis-bg);
      border: 3px solid var(--chassis-border);
      border-radius: 18px;
      padding: 24px 28px;
      box-shadow: var(--chassis-shadow);
      position: relative;
      overflow: hidden;
    }

    /* Screws on chassis corners */
    .chassis::before, .chassis::after {
      content: '';
      position: absolute;
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: radial-gradient(circle, #555 40%, #222 100%);
      box-shadow: inset 0 1px 1px #fff, 0 1px 2px rgba(0,0,0,0.8);
    }
    .chassis::before { top: 10px; left: 10px; }
    .chassis::after { bottom: 10px; right: 10px; }

    /* Board Header Label Bar */
    .board-header-bar {
      display: grid;
      grid-template-columns: 88px 1fr 68px 74px 106px;
      gap: 12px;
      padding: 0 4px 12px 4px;
      border-bottom: 2px solid var(--chassis-border);
      margin-bottom: 16px;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      color: var(--header-text);
      opacity: 0.9;
    }

    .board-header-bar.hidden {
      display: none;
    }

    /* Grid of Rows */
    .board-grid {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .board-row {
      display: flex;
      gap: 5px;
      align-items: center;
    }

    /* Split-Flap Unit (Cell) */
    .flap-unit {
      position: relative;
      width: 40px;
      height: 56px;
      perspective: 350px;
      background: var(--flap-bg);
      border-radius: 5px;
      box-shadow: 0 3px 6px rgba(0, 0, 0, 0.7);
    }

    /* Top and Bottom Halves */
    .flap-half {
      position: absolute;
      left: 0;
      width: 100%;
      height: 50%;
      overflow: hidden;
      box-sizing: border-box;
      backface-visibility: hidden;
      -webkit-backface-visibility: hidden;
    }

    .flap-half-inner {
      position: absolute;
      left: 0;
      width: 100%;
      height: 56px; /* full unit height */
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
      font-weight: 800;
      font-size: 38px;
      color: var(--flap-text);
      text-transform: uppercase;
      line-height: 56px;
    }

    /* Top half */
    .flap-top {
      top: 0;
      border-radius: 5px 5px 0 0;
      background: var(--flap-gradient-top);
      border-top: 1px solid var(--highlight);
      border-bottom: 1px solid var(--hinge-line);
      transform-origin: bottom center;
    }

    .flap-top .flap-half-inner {
      top: 0;
    }

    /* Bottom half */
    .flap-bot {
      bottom: 0;
      border-radius: 0 0 5px 5px;
      background: var(--flap-gradient-bot);
      border-top: 1px solid var(--hinge-line);
      transform-origin: top center;
    }

    .flap-bot .flap-half-inner {
      top: -28px; /* offset by half height */
    }

    /* 3D Falling Plates */
    .flap-falling {
      z-index: 3;
      transform-origin: bottom center;
      transition: transform var(--flip-speed, 0.08s) linear;
    }

    .flap-rising {
      z-index: 2;
      transform-origin: top center;
      transform: rotateX(90deg);
      transition: transform var(--flip-speed, 0.08s) linear;
    }

    /* Horizontal center hinge line & side notches */
    .flap-unit::before, .flap-unit::after {
      content: '';
      position: absolute;
      top: calc(50% - 2.5px);
      width: 3px;
      height: 5px;
      background: var(--chassis-border);
      z-index: 10;
      border-radius: 1px;
    }
    .flap-unit::before { left: -1px; }
    .flap-unit::after { right: -1px; }

    /* Controls Panel */
    .controls-container {
      width: 100%;
      max-width: 1120px;
      margin-top: 24px;
      background: var(--panel-bg);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border: 1px solid var(--border-color);
      border-radius: 18px;
      padding: 16px 22px;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.25);
    }

    .btn-group {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }

    button {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--border-color);
      color: var(--text-main);
      padding: 8px 14px;
      border-radius: 11px;
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 7px;
      transition: all 0.2s ease;
      touch-action: manipulation;
    }

    button:hover {
      background: rgba(255, 255, 255, 0.1);
      border-color: rgba(255, 255, 255, 0.2);
      transform: translateY(-1px);
    }

    button:active {
      transform: translateY(0);
    }

    button.primary {
      background: var(--accent);
      color: #000;
      font-weight: 600;
      border-color: transparent;
      box-shadow: 0 4px 14px var(--accent-glow);
    }

    button.primary:hover {
      opacity: 0.92;
      box-shadow: 0 6px 18px var(--accent-glow);
    }

    button.active {
      background: var(--accent);
      color: #000;
      font-weight: 600;
      border-color: transparent;
    }

    .control-item {
      display: flex;
      align-items: center;
      gap: 9px;
      font-size: 13px;
      color: var(--text-muted);
    }

    .control-item label {
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.8px;
      font-weight: 600;
    }

    select, input[type="text"] {
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid var(--border-color);
      color: var(--text-main);
      padding: 7px 11px;
      border-radius: 9px;
      font-size: 13px;
      outline: none;
      cursor: pointer;
      transition: border-color 0.2s ease;
    }

    select:focus, input[type="text"]:focus {
      border-color: var(--accent);
    }

    select option {
      background: #151821;
      color: #fff;
    }

    /* Message Input Row */
    .composer-bar {
      width: 100%;
      max-width: 1120px;
      margin-top: 14px;
      display: flex;
      gap: 10px;
    }

    .composer-bar input {
      flex: 1;
      padding: 10px 16px;
      border-radius: 12px;
      font-size: 14px;
      text-transform: uppercase;
    }

    /* Info Bar & Keyboard Shortcuts */
    .info-bar {
      margin-top: 16px;
      font-size: 12px;
      color: var(--text-muted);
      display: flex;
      gap: 20px;
      align-items: center;
      flex-wrap: wrap;
      justify-content: center;
    }

    .kbd-tag {
      background: rgba(255, 255, 255, 0.07);
      border: 1px solid var(--border-color);
      padding: 2px 6px;
      border-radius: 5px;
      font-size: 10px;
      font-family: inherit;
      color: var(--text-main);
    }

    /* Responsive scaling */
    @media (max-width: 1100px) {
      .flap-unit {
        width: 32px;
        height: 46px;
      }
      .flap-half-inner {
        height: 46px;
        font-size: 30px;
        line-height: 46px;
      }
      .flap-bot .flap-half-inner {
        top: -23px;
      }
      .chassis {
        padding: 18px 20px;
      }
      .board-header-bar {
        grid-template-columns: 70px 1fr 54px 58px 84px;
        font-size: 10px;
      }
    }

    @media (max-width: 860px) {
      body {
        padding: 12px;
      }
      .flap-unit {
        width: 22px;
        height: 34px;
      }
      .flap-half-inner {
        height: 34px;
        font-size: 21px;
        line-height: 34px;
      }
      .flap-bot .flap-half-inner {
        top: -17px;
      }
      .board-row {
        gap: 3px;
      }
      .chassis {
        padding: 12px 14px;
        border-radius: 12px;
      }
      .board-header-bar {
        font-size: 8px;
        grid-template-columns: 50px 1fr 38px 42px 60px;
        gap: 6px;
        margin-bottom: 10px;
      }
      .controls-container {
        flex-direction: column;
        align-items: stretch;
      }
      .btn-group {
        justify-content: center;
      }
    }

    @media (max-width: 580px) {
      .flap-unit {
        width: 14px;
        height: 23px;
        border-radius: 3px;
      }
      .flap-half-inner {
        height: 23px;
        font-size: 14px;
        line-height: 23px;
      }
      .flap-bot .flap-half-inner {
        top: -11.5px;
      }
      .board-row {
        gap: 2px;
      }
      .board-grid {
        gap: 6px;
      }
      .board-header-bar {
        display: none;
      }
    }
  </style>
</head>
<body data-theme="noir">

  <header>
    <div class="brand">
      <h1>Solari Board</h1>
      <span>Mechanical Split-Flap Display</span>
    </div>
    <div class="header-indicators">
      <div class="live-tag">
        <span class="live-dot"></span>
        <span id="board-status">Departures Live</span>
      </div>
      <div id="live-clock" style="font-feature-settings: 'tnum'; font-variant-numeric: tabular-nums; font-weight: 600;">
        --:--:--
      </div>
    </div>
  </header>

  <main class="chassis-wrapper">
    <div class="chassis">
      <div class="board-header-bar" id="header-bar">
        <span>Flight</span>
        <span>Destination</span>
        <span>Gate</span>
        <span>Time</span>
        <span>Remarks</span>
      </div>
      <div class="board-grid" id="board-grid">
        <!-- 6 rows x 22 columns of mechanical split-flap units -->
      </div>
    </div>
  </main>

  <div class="composer-bar">
    <input type="text" id="custom-input" placeholder="Type a custom announcement or message..." maxlength="132">
    <button class="primary" id="btn-cascade">Cascade Message</button>
  </div>

  <div class="controls-container">
    <div class="btn-group">
      <button id="btn-mode-departures" class="active">Airport Departures</button>
      <button id="btn-mode-clock">Departure Clock</button>
      <button id="btn-mode-quotes">Quotes</button>
      <button id="btn-shuffle" title="Mechanical cascade shuffle">Shuffle All</button>
    </div>

    <div class="btn-group">
      <div class="control-item">
        <label for="theme-select">Theme</label>
        <select id="theme-select">
          <option value="noir" selected>Classic Noir</option>
          <option value="railway">Geneva Railway</option>
          <option value="bronze">Grand Central</option>
          <option value="cyber">Cyberpunk</option>
        </select>
      </div>

      <button id="btn-sound" class="active" title="Toggle mechanical flap audio">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon>
          <path d="M19.07 4.93a10 10 0 0 1 0 14.14M15.54 8.46a5 5 0 0 1 0 7.07"></path>
        </svg>
        Sound On
      </button>

      <button id="btn-fullscreen" title="Fullscreen view">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M8 3H5a2 2 0 0 0-2 2v3m18 0V5a2 2 0 0 0-2-2h-3m0 18h3a2 2 0 0 0 2-2v-3M3 16v3a2 2 0 0 0 2 2h3"></path>
        </svg>
      </button>
    </div>
  </div>

  <div class="info-bar">
    <span><kbd class="kbd-tag">Space</kbd> Shuffle Cascade</span>
    <span><kbd class="kbd-tag">T</kbd> Cycle Theme</span>
    <span><kbd class="kbd-tag">M</kbd> Mute / Unmute</span>
    <span><kbd class="kbd-tag">F</kbd> Fullscreen</span>
    <span>Inspired by Solari di Udine</span>
  </div>

  <script>
    /* ==========================================================================
       MECHANICAL SOLARI SPLIT-FLAP DISPLAY ENGINE
       ========================================================================== */

    // Full mechanical character wheel in order
    const CHAR_SET = " ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789.:-/'\"!?#$*&";

    // Flight schedule database
    const FLIGHT_SCHEDULES = [
      [
        "BA 178  LONDON LHR    B12 10:45 ON TIME   ",
        "AF 022  PARIS CDG     C04 11:15 BOARDING  ",
        "EK 204  DUBAI DXB     A18 11:30 ON TIME   ",
        "JL 006  TOKYO HND     D09 11:55 DELAYED   ",
        "SQ 026  SINGAPORE SIN B22 12:10 GATE OPEN ",
        "LH 400  FRANKFURT FRA A05 12:35 ON TIME   "
      ],
      [
        "BA 178  LONDON LHR    B12 10:45 DEPARTED  ",
        "AF 022  PARIS CDG     C04 11:15 LAST CALL ",
        "EK 204  DUBAI DXB     A18 11:30 BOARDING  ",
        "JL 006  TOKYO HND     D09 12:20 RESCHED   ",
        "SQ 026  SINGAPORE SIN B22 12:10 BOARDING  ",
        "QF 012  SYDNEY SYD    E02 12:50 ON TIME   "
      ],
      [
        "LX 016  ZURICH ZRH    A08 13:00 ON TIME   ",
        "DL 106  NEW YORK JFK  B14 13:15 ON TIME   ",
        "CX 888  HONG KONG HKG C11 13:40 BOARDING  ",
        "UA 837  SAN FRANCISCO D03 14:05 ON TIME   ",
        "KL 642  AMSTERDAM AMS A12 14:25 GATE OPEN ",
        "QR 701  DOHA DOH      B07 14:50 ON TIME   "
      ]
    ];

    // Famous Quotes
    const QUOTES = [
      [
        "  NOT ALL THOSE WHO   ",
        "   WANDER ARE LOST    ",
        "                      ",
        "      J.R.R. TOLKIEN  ",
        "                      ",
        "                      "
      ],
      [
        " THE JOURNEY OF A     ",
        " THOUSAND MILES       ",
        " BEGINS WITH A        ",
        " SINGLE STEP          ",
        "             LAO TZU  ",
        "                      "
      ],
      [
        " TIME WAITS FOR       ",
        " NO ONE.              ",
        "                      ",
        " MAKE EVERY SECOND    ",
        " COUNT.               ",
        "                      "
      ]
    ];

    // Mechanical Audio Engine
    class SplitFlapAudio {
      constructor() {
        this.ctx = null;
        this.enabled = true;
        this.lastClickTime = 0;
      }

      init() {
        if (!this.ctx) {
          const AudioContext = window.AudioContext || window.webkitAudioContext;
          this.ctx = new AudioContext();
        }
        if (this.ctx.state === 'suspended') {
          this.ctx.resume();
        }
      }

      toggle() {
        this.enabled = !this.enabled;
        if (this.enabled) this.init();
        return this.enabled;
      }

      playFlapClick() {
        if (!this.enabled) return;
        this.init();

        const now = this.ctx.currentTime;
        // Limit max clicks per second to prevent audio clipping on massive cascade
        if (now - this.lastClickTime < 0.008) return;
        this.lastClickTime = now;

        // 1. High transient mechanical snap
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        const freqRand = 1400 + (Math.random() * 400 - 200);

        osc.type = 'triangle';
        osc.frequency.setValueAtTime(freqRand, now);
        osc.frequency.exponentialRampToValueAtTime(80, now + 0.025);

        gain.gain.setValueAtTime(0.045, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.025);

        osc.connect(gain);
        gain.connect(this.ctx.destination);

        osc.start(now);
        osc.stop(now + 0.025);

        // 2. Low thud of plastic leaf slapping stop tab
        const thud = this.ctx.createOscillator();
        const thudGain = this.ctx.createGain();
        thud.type = 'sine';
        thud.frequency.setValueAtTime(160 + (Math.random() * 40 - 20), now);
        thud.frequency.exponentialRampToValueAtTime(30, now + 0.035);

        thudGain.gain.setValueAtTime(0.06, now);
        thudGain.gain.exponentialRampToValueAtTime(0.001, now + 0.035);

        thud.connect(thudGain);
        thudGain.connect(this.ctx.destination);

        thud.start(now);
        thud.stop(now + 0.035);
      }
    }

    const audio = new SplitFlapAudio();

    // Single Split-Flap Cell Unit
    class FlapUnit {
      constructor(row, col) {
        this.row = row;
        this.col = col;
        this.currentChar = ' ';
        this.targetChar = ' ';
        this.isFlipping = false;

        this.el = null;
        this.topStatic = null;
        this.botStatic = null;
        this.topFalling = null;
        this.botRising = null;

        this.createDOM();
      }

      createDOM() {
        const unit = document.createElement('div');
        unit.className = 'flap-unit';
        unit.dataset.row = this.row;
        unit.dataset.col = this.col;

        // Static top and bottom
        this.topStatic = this.createHalf('flap-top');
        this.botStatic = this.createHalf('flap-bot');

        // Dynamic 3D falling plates
        this.topFalling = this.createHalf('flap-top flap-falling');
        this.botRising = this.createHalf('flap-bot flap-rising');

        unit.appendChild(this.topStatic);
        unit.appendChild(this.botStatic);
        unit.appendChild(this.topFalling);
        unit.appendChild(this.botRising);

        this.el = unit;
        this.setCharDirect(' ');
      }

      createHalf(className) {
        const half = document.createElement('div');
        half.className = `flap-half ${className}`;
        const inner = document.createElement('div');
        inner.className = 'flap-half-inner';
        inner.innerText = ' ';
        half.appendChild(inner);
        return half;
      }

      setCharDirect(char) {
        this.currentChar = char;
        this.targetChar = char;
        this.topStatic.firstElementChild.innerText = char;
        this.botStatic.firstElementChild.innerText = char;
        this.topFalling.firstElementChild.innerText = char;
        this.botRising.firstElementChild.innerText = char;
      }

      flipTo(targetChar, speedMs = 70) {
        this.targetChar = targetChar.toUpperCase();
        if (this.isFlipping) return;
        this.stepFlip(speedMs);
      }

      stepFlip(speedMs) {
        if (this.currentChar === this.targetChar) {
          this.isFlipping = false;
          return;
        }

        this.isFlipping = true;
        const curIdx = CHAR_SET.indexOf(this.currentChar);
        const nextIdx = (curIdx + 1) % CHAR_SET.length;
        const nextChar = CHAR_SET[nextIdx];

        // Prepare next plate
        this.topStatic.firstElementChild.innerText = nextChar;
        this.botRising.firstElementChild.innerText = nextChar;

        this.topFalling.style.transition = `transform ${speedMs * 0.5}ms ease-in`;
        this.botRising.style.transition = `transform ${speedMs * 0.5}ms ease-out`;

        // 1. Top falls forward 90deg
        this.topFalling.style.transform = 'rotateX(-90deg)';

        setTimeout(() => {
          // Play mechanical click
          audio.playFlapClick();

          // 2. Bottom rises into view from 90deg to 0deg
          this.botRising.style.transform = 'rotateX(0deg)';

          setTimeout(() => {
            // Settle on next character
            this.currentChar = nextChar;
            this.setCharDirect(nextChar);

            // Reset 3D transforms without transition
            this.topFalling.style.transition = 'none';
            this.botRising.style.transition = 'none';
            this.topFalling.style.transform = 'rotateX(0deg)';
            this.botRising.style.transform = 'rotateX(90deg)';

            // Continue stepping toward target
            if (this.currentChar !== this.targetChar) {
              setTimeout(() => this.stepFlip(speedMs), 8);
            } else {
              this.isFlipping = false;
            }
          }, speedMs * 0.5);
        }, speedMs * 0.5);
      }
    }

    // Board Controller
    class SolariBoard {
      constructor(rows = 6, cols = 22) {
        this.rows = rows;
        this.cols = cols;
        this.grid = [];
        this.mode = 'departures'; // 'departures', 'clock', 'quotes', 'custom'
        this.scheduleIndex = 0;
        this.quoteIndex = 0;
        this.cycleInterval = null;
        this.clockInterval = null;

        this.boardGridEl = document.getElementById('board-grid');
        this.headerBarEl = document.getElementById('header-bar');
        this.statusTextEl = document.getElementById('board-status');
        this.liveClockEl = document.getElementById('live-clock');

        this.initDOM();
        this.initEvents();
        this.setMode('departures');
        this.startLiveClock();
      }

      initDOM() {
        this.boardGridEl.innerHTML = '';
        this.grid = [];

        for (let r = 0; r < this.rows; r++) {
          const rowEl = document.createElement('div');
          rowEl.className = 'board-row';
          const rowUnits = [];

          for (let c = 0; c < this.cols; c++) {
            const unit = new FlapUnit(r, c);
            rowEl.appendChild(unit.el);
            rowUnits.push(unit);
          }

          this.boardGridEl.appendChild(rowEl);
          this.grid.push(rowUnits);
        }
      }

      initEvents() {
        // Theme selector
        document.getElementById('theme-select').addEventListener('change', (e) => {
          document.body.dataset.theme = e.target.value;
        });

        // Mode buttons
        const btnDep = document.getElementById('btn-mode-departures');
        const btnClock = document.getElementById('btn-mode-clock');
        const btnQuotes = document.getElementById('btn-mode-quotes');

        const setBtn = (activeBtn) => {
          [btnDep, btnClock, btnQuotes].forEach(b => b.classList.remove('active'));
          activeBtn.classList.add('active');
        };

        btnDep.addEventListener('click', () => {
          setBtn(btnDep);
          this.setMode('departures');
        });

        btnClock.addEventListener('click', () => {
          setBtn(btnClock);
          this.setMode('clock');
        });

        btnQuotes.addEventListener('click', () => {
          setBtn(btnQuotes);
          this.setMode('quotes');
        });

        // Shuffle button
        document.getElementById('btn-shuffle').addEventListener('click', () => {
          this.cascadeShuffle();
        });

        // Custom Message Cascade
        const customInput = document.getElementById('custom-input');
        const btnCascade = document.getElementById('btn-cascade');

        const submitCustom = () => {
          const text = customInput.value.trim();
          if (text) {
            setBtn(btnDep);
            [btnDep, btnClock, btnQuotes].forEach(b => b.classList.remove('active'));
            this.setMode('custom', text);
          }
        };

        btnCascade.addEventListener('click', submitCustom);
        customInput.addEventListener('keydown', (e) => {
          if (e.key === 'Enter') submitCustom();
        });

        // Sound button
        const btnSound = document.getElementById('btn-sound');
        btnSound.addEventListener('click', () => {
          const isNowOn = audio.toggle();
          btnSound.classList.toggle('active', isNowOn);
          btnSound.innerHTML = isNowOn
            ? `<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon><path d="M19.07 4.93a10 10 0 0 1 0 14.14M15.54 8.46a5 5 0 0 1 0 7.07"></path></svg> Sound On`
            : `<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon><line x1="23" y1="9" x2="17" y2="15"></line><line x1="17" y1="9" x2="23" y2="15"></line></svg> Sound Off`;
        });

        // Fullscreen
        document.getElementById('btn-fullscreen').addEventListener('click', () => {
          if (!document.fullscreenElement) {
            document.documentElement.requestFullscreen().catch(() => {});
          } else {
            document.exitFullscreen();
          }
        });

        // Keyboard shortcuts
        window.addEventListener('keydown', (e) => {
          if (e.target.tagName === 'INPUT' || e.target.tagName === 'SELECT') return;
          if (e.code === 'Space') {
            e.preventDefault();
            this.cascadeShuffle();
          } else if (e.key === 't' || e.key === 'T') {
            const themes = ['noir', 'railway', 'bronze', 'cyber'];
            const cur = document.body.dataset.theme || 'noir';
            const next = themes[(themes.indexOf(cur) + 1) % themes.length];
            document.body.dataset.theme = next;
            document.getElementById('theme-select').value = next;
          } else if (e.key === 'm' || e.key === 'M') {
            document.getElementById('btn-sound').click();
          } else if (e.key === 'f' || e.key === 'F') {
            document.getElementById('btn-fullscreen').click();
          }
        });
      }

      startLiveClock() {
        setInterval(() => {
          const now = new Date();
          const h = String(now.getHours() % 12 || 12).padStart(2, '0');
          const m = String(now.getMinutes()).padStart(2, '0');
          const s = String(now.getSeconds()).padStart(2, '0');
          const ampm = now.getHours() >= 12 ? 'PM' : 'AM';
          this.liveClockEl.innerText = `${h}:${m}:${s} ${ampm}`;

          if (this.mode === 'clock') {
            this.renderClockBoard(now);
          }
        }, 1000);
      }

      setMode(newMode, customText = '') {
        this.mode = newMode;
        clearInterval(this.cycleInterval);

        if (newMode === 'departures') {
          this.headerBarEl.classList.remove('hidden');
          this.statusTextEl.innerText = 'Departures Live';
          this.renderSchedule(this.scheduleIndex);
          // Auto rotate flight updates every 25 seconds
          this.cycleInterval = setInterval(() => {
            this.scheduleIndex = (this.scheduleIndex + 1) % FLIGHT_SCHEDULES.length;
            this.renderSchedule(this.scheduleIndex);
          }, 25000);
        } else if (newMode === 'clock') {
          this.headerBarEl.classList.add('hidden');
          this.statusTextEl.innerText = 'Departure Clock';
          this.renderClockBoard(new Date(), true);
        } else if (newMode === 'quotes') {
          this.headerBarEl.classList.add('hidden');
          this.statusTextEl.innerText = 'Inspiring Words';
          this.renderQuote(this.quoteIndex);
          this.cycleInterval = setInterval(() => {
            this.quoteIndex = (this.quoteIndex + 1) % QUOTES.length;
            this.renderQuote(this.quoteIndex);
          }, 18000);
        } else if (newMode === 'custom') {
          this.headerBarEl.classList.add('hidden');
          this.statusTextEl.innerText = 'Announcement';
          this.renderCustomText(customText);
        }
      }

      renderSchedule(index) {
        const schedule = FLIGHT_SCHEDULES[index];
        for (let r = 0; r < this.rows; r++) {
          const rowText = (schedule[r] || '').padEnd(this.cols, ' ');
          this.setRowText(r, rowText, r * 160);
        }
      }

      renderQuote(index) {
        const quote = QUOTES[index];
        for (let r = 0; r < this.rows; r++) {
          const rowText = (quote[r] || '').padEnd(this.cols, ' ');
          this.setRowText(r, rowText, r * 140);
        }
      }

      renderCustomText(text) {
        // Break text cleanly across 6 rows of 22 characters
        const clean = text.toUpperCase();
        const words = clean.split(' ');
        const lines = ['', '', '', '', '', ''];
        let lineIdx = 0;

        for (const w of words) {
          if (lineIdx >= this.rows) break;
          if ((lines[lineIdx] + ' ' + w).trim().length <= this.cols) {
            lines[lineIdx] = (lines[lineIdx] + ' ' + w).trim();
          } else {
            lineIdx++;
            if (lineIdx < this.rows) lines[lineIdx] = w;
          }
        }

        for (let r = 0; r < this.rows; r++) {
          const centered = lines[r].padStart(Math.floor((this.cols + lines[r].length) / 2), ' ').padEnd(this.cols, ' ');
          this.setRowText(r, centered, r * 140);
        }
      }

      renderClockBoard(now, instant = false) {
        const days = ['SUNDAY', 'MONDAY', 'TUESDAY', 'WEDNESDAY', 'THURSDAY', 'FRIDAY', 'SATURDAY'];
        const months = ['JANUARY', 'FEBRUARY', 'MARCH', 'APRIL', 'MAY', 'JUNE', 'JULY', 'AUGUST', 'SEPTEMBER', 'OCTOBER', 'NOVEMBER', 'DECEMBER'];

        const dayName = days[now.getDay()];
        const monthName = months[now.getMonth()];
        const dateNum = now.getDate();
        const year = now.getFullYear();

        const h = String(now.getHours() % 12 || 12).padStart(2, '0');
        const m = String(now.getMinutes()).padStart(2, '0');
        const ampm = now.getHours() >= 12 ? 'PM' : 'AM';

        const lines = [
          `      ${dayName}     `.padEnd(this.cols, ' '),
          `   ${monthName} ${dateNum}    `.padEnd(this.cols, ' '),
          `        ${year}        `.padEnd(this.cols, ' '),
          `                      `.padEnd(this.cols, ' '),
          `      ${h}:${m} ${ampm}      `.padEnd(this.cols, ' '),
          `   LOCAL STATION TIME  `.padEnd(this.cols, ' ')
        ];

        for (let r = 0; r < this.rows; r++) {
          this.setRowText(r, lines[r], instant ? 0 : r * 100);
        }
      }

      setRowText(r, text, delayMs = 0) {
        const padded = text.padEnd(this.cols, ' ').substring(0, this.cols);
        setTimeout(() => {
          for (let c = 0; c < this.cols; c++) {
            const unit = this.grid[r][c];
            const targetChar = padded[c] || ' ';
            const stagger = c * 28;
            setTimeout(() => {
              unit.flipTo(targetChar, 65);
            }, stagger);
          }
        }, delayMs);
      }

      cascadeShuffle() {
        for (let r = 0; r < this.rows; r++) {
          for (let c = 0; c < this.cols; c++) {
            const unit = this.grid[r][c];
            const randChar = CHAR_SET[Math.floor(Math.random() * CHAR_SET.length)];
            setTimeout(() => {
              unit.flipTo(randChar, 50);
            }, (c + r * 2) * 35);
          }
        }
      }
    }

    // Initialize display on load
    window.addEventListener('DOMContentLoaded', () => {
      new SolariBoard(6, 22);
    });
  </script>
